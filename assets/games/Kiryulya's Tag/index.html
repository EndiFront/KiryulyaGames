<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Пятнашки</title>
  </head>
  <body>
    <div class="game-stage">
      <div class="ui-top">
        <div class="ui-badge">
          <span>Ходы:</span>
          <div id="moves" class="val-box">0</div>
        </div>
      </div>

      <div class="board-container">
        <div class="puzzle-board" id="board"></div>
      </div>

      <div class="ui-bottom">
        <button id="restart-btn" class="btn">Заново</button>
      </div>

      <div id="overlay" class="overlay">
        <div class="modal">
          <h1 id="modal-title">Пятнашки</h1>
          <p id="modal-desc">Перетаскивай костяшки мышкой, чтобы собрать их по порядку от 1 до 15.</p>
          <button id="start-btn" class="btn">Начать игру</button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
